[package]
name = "soma-agent"
version = "0.1.0"
edition = "2024"
description = "Durable Soma task composition over neuron programs and explicit workers"
license = "Cyber"

[dependencies]
neuron-id = { path = "../../neuron/id" }
neuron-model = { path = "../../neuron/model", features = ["serde"] }
neuron-engine = { path = "../../neuron/engine" }
neuron-node = { path = "../../neuron/node" }
neuron-rune = { path = "../../neuron/rune" }
cybergraph = { path = "../../cybergraph", features = ["local-storage"] }
hemera = { package = "cyber-hemera", path = "../../hemera/rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
mudra = { package = "cyber-mudra", path = "../../mudra", default-features = false }
